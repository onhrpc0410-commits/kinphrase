<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f2f5f7"></head><body><title>単語帳</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: one-screen phone app. Scrolling content area above a bottom tab bar; the test card fills the middle. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#14202b; --muted:#5b6a77; --line:#dce3e9;
  --accent:#c9971c; --accent-ink:#7d5a07; --on-accent:#1b1405; --accent-soft:#f6ecd0;
  --good:#1d8456; --good-soft:#dcf1e6; --bad:#c2402b; --bad-soft:#fae1dc;
  --font-body:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;
  --font-en:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e8edf1; --muted:#97a5b1; --line:#2a3641;
  --accent:#e0b04a; --accent-ink:#e6bd62; --on-accent:#1b1405; --accent-soft:#2c2614;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ef7a67; --bad-soft:#321b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e8edf1; --muted:#97a5b1; --line:#2a3641;
  --accent:#e0b04a; --accent-ink:#e6bd62; --on-accent:#1b1405; --accent-soft:#2c2614;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ef7a67; --bad-soft:#321b17; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#main{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
h2{font-size:13px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.08em}
.nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500;min-height:56px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.nav button[aria-current="page"] svg{stroke:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
input[type=text],input[type=number],input[type=search],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;font-size:16px}
input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;min-height:46px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>*{min-width:0}
.grow{flex:1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:10px 6px;min-height:44px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* word rows */
.words{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.w{display:grid;grid-template-columns:3.2rem 1fr auto;gap:10px;align-items:start;padding:12px 12px 12px 8px;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .no{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;color:var(--accent-ink);text-align:right;padding-top:1px}
.w .en{font-family:var(--font-en);font-weight:600;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.w .ja{color:var(--muted);font-size:14px;margin-top:2px}
.w .acts{display:flex;gap:6px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.note{color:var(--muted);font-size:13px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.count{font-variant-numeric:tabular-nums}

/* list cards */
.lcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:56px}
.lcard .nm{font-weight:700;overflow-wrap:anywhere}
.lcard .ct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}

/* test */
.stats{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0}
.card{position:relative;width:100%;max-height:100%;min-height:min(60vh,380px);background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 20px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s ease;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card .cno{position:absolute;top:14px;left:16px;font-size:13px;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.card .cen{font-family:var(--font-en);font-weight:600;font-size:clamp(34px,11vw,52px);line-height:1.15;overflow-wrap:anywhere}
.card .cja{font-size:20px;font-weight:500;line-height:1.6;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.card .tap{color:var(--muted);font-size:13px}
.card .ov{position:absolute;inset:0;border-radius:18px;display:flex;align-items:flex-start;padding:14px 22px;font-weight:700;font-size:44px;line-height:1;opacity:0;pointer-events:none}
.card .ov.r{background:var(--good-soft);color:var(--good);justify-content:flex-start}
.card .ov.l{background:var(--bad-soft);color:var(--bad);justify-content:flex-end}
.ans{display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.ans .btn{min-height:54px;font-size:15px}
.ans .no,.ans .yes{font-size:24px;line-height:1}
.ans .no{color:var(--bad);border-color:var(--bad)}
.ans .yes{color:var(--good);border-color:var(--good)}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-en)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum .good{color:var(--good)}.sum .bad{color:var(--bad)}

/* bulk register */
.disp{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:76px}
.disp .dn{font-family:var(--font-en);font-weight:600;font-size:38px;line-height:1;min-width:4ch;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.disp .dw{min-width:0}
.disp .e{font-family:var(--font-en);font-weight:600;font-size:20px;line-height:1.3;overflow-wrap:anywhere}
.disp .j{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--accent-soft)}
.pad .add{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700}
.pad .add:disabled{opacity:.4}
.stg{flex:1;min-height:64px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.sc{border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:5px 12px;min-height:36px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.sc b{font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.sc.dup{border-color:var(--line);background:transparent;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:80%;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;max-width:90%}
@media (prefers-reduced-motion:reduce){.card,.prog i{transition:none}}

[hidden]{display:none!important}
.nav{grid-template-columns:repeat(4,1fr)}
.nav button{font-size:11px}
textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;line-height:1.5;resize:vertical;min-height:110px}
.deckchip{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:4px 12px;min-height:32px;font-size:13px;font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk{display:inline-block;margin-top:4px;font-size:11px;color:var(--accent-ink);border:1px solid var(--accent);border-radius:999px;padding:0 8px}
.dcard{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 10px 6px 4px}
.dcard.cur{border-color:var(--accent)}
.dcard .dmain{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:10px;min-height:52px}
.dcard .nm{font-weight:700;overflow-wrap:anywhere}
.dcard .ct{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.filebtn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:700;font-size:14px;min-height:28px}
pre.pr{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-body);font-size:13px;color:var(--muted);margin:10px 0}
table.pv{width:100%;border-collapse:collapse;font-size:13px}
table.pv td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top;overflow-wrap:anywhere}
table.pv td:first-child{color:var(--accent-ink);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.warn{color:var(--bad);font-size:13px}
</style>

<div id="app">
  <div id="main"></div>
  <nav class="nav" aria-label="メニュー">

  </nav>
</div>

/* CSV 取り込み */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const delim = first.includes('\t') && !first.includes(',') ? '\t' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"' && cell === '') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; }
    else cell += c;
  }
  row.push(cell); if (row.some(x => x.trim() !== '')) rows.push(row);
  return rows;
}
const HEAD_A = ['番号', '見出し番号', 'no', 'no.', '#', 'id', '英単語', '単語', 'word', 'english', '英語'], HEAD_B = ['日本語', '日本語訳', '意味', '訳', 'meaning', 'japanese'];
function interpretCSV(rows) {
  const warn = [];
  if (rows.length && (HEAD_A.includes(rows[0][0].trim().toLowerCase()) || HEAD_B.includes((rows[0][1] || '').trim().toLowerCase()))) rows = rows.slice(1);
  const numeric = rows.length > 0 && rows.every(r => r.length >= 3 && /^\d+$/.test(half(r[0]).trim()));
  const items = [];
  rows.forEach((r, i) => {
    const n = numeric ? +half(r[0]).trim() : null, en = (numeric ? r[1] : r[0]) || '', ja = (numeric ? r[2] : r[1]) || '';
    if (!en.trim() || !ja.trim()) { warn.push(i + 1); return; }
    items.push({ n, en: en.trim(), ja: ja.trim() });
  });
  return { numeric, items: items.slice(0, 20000), warn, total: rows.length };
}

    let did, rows;
    if (imp.target === 'new') {
      const name = imp.name.trim(); if (!name) return toast('単語帳の名前を入力してください');
      did = 'd' + Date.now().toString(36); store.decks.push({ id: did, name, rows: [] });
    } else did = imp.target;
    const r = rawDeck(did), map = new Map(r.rows.map(x => [x[0], x]));
    let nextN = (r.rows.length ? Math.max(...r.rows.map(x => x[0])) : 0) + 1, over = 0;
    res.items.forEach(x => { const n = x.n != null ? x.n : nextN++; if (map.has(n)) over++; map.set(n, [n, x.en, x.ja]); });
    r.rows = [...map.values()].sort((a, b) => a[0] - b[0]);
    if (!save()) { if (imp.target === 'new') store.decks = store.decks.filter(x => x.id !== did); return; }
    rebuild(); if (imp.target === 'new') setDeck(did);
    toast(res.items.length + '語を取り込みました' + (over ? `（${over}語は上書き）` : ''));
    dv = { view: 'detail', id: did }; renderDecks();
  };
  upd();
}

/* バックアップ・復元 */
function decksBackup() {
  const json = JSON.stringify({ app: 'kinphrase', v: 1, cur: store.cur, decks: store.decks, lists: store.lists, last: store.last });
  main.innerHTML = `<div class="row"><button class="btn small" id="bk">‹ 戻る</button><h1 class="grow">バックアップ・復元</h1></div>
  <h2>バックアップ</h2>
  <div class="note">単語帳（自作分）とリストの全データを書き出します。コピーしてメモやメールに貼っておくか、ファイルに保存してください。</div>
  <div class="row"><button class="btn grow" id="cp">データをコピー</button><button class="btn grow" id="dl">ファイルに保存</button></div>
  <h2 style="margin-top:8px">復元</h2>
  <div class="note">バックアップのデータを貼り付けるか、保存したファイルを選びます。今のデータは置き換わります。</div>
  <textarea id="rt" rows="4" spellcheck="false" placeholder="ここに貼り付け"></textarea>
  <div class="row"><label class="btn filebtn grow" for="rf">ファイルを選ぶ</label><input id="rf" type="file" accept=".json,.txt,application/json,text/plain" hidden><button class="btn danger grow" id="rs">復元する</button></div>`;
  $('#bk').onclick = () => { dv = null; renderDecks(); };
  $('#cp').onclick = () => copyText(json);
  $('#dl').onclick = () => download('kinphrase-backup.json', json, 'application/json');
  $('#rf').onchange = async e => { const f = e.target.files[0]; if (f) $('#rt').value = await readFileText(f); };
  confirmBtn($('#rs'), 'もう一度押すと、今のデータを置き換えます', () => {
    try {
      const s = JSON.parse($('#rt').value);
      if (!s || s.app !== 'kinphrase' || !Array.isArray(s.lists) || !Array.isArray(s.decks)) throw 0;
      store.decks = s.decks; store.lists = s.lists; store.cur = s.cur || 'kin'; store.last = Object.assign(store.last, s.last || {});
      store.lists.forEach(l => { if (!l.deckId) l.deckId = 'kin'; });
      rebuild(); run = null; openList = null; bulkOpen = false; bulk.staged = []; bulk.target = weakOf(store.cur).id; save();
      toast('復元しました'); dv = null; renderDecks();
    } catch (e) { toast('復元できませんでした。バックアップのデータを確認してください'); }
  });
}

/* ---------- shell ---------- */
function draw() {
  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
  main.scrollTop = 0;
  if (tab === 'search') renderSearch();
  else if (tab === 'lists') renderLists();
  else if (tab === 'decks') renderDecks();
  else if (run) renderRun(); else renderTestSetup();
}
document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab;
  if (tab === 'lists') { openList = null; bulkOpen = false; } if (tab === 'decks') dv = null; draw(); });
draw();
/* ピンチ・ダブルタップによる拡大を無効化 */
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>
