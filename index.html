/* Layout: one-screen phone app. Scrolling content area above a bottom tab bar; the test card fills the middle. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#14202b; --muted:#5b6a77; --line:#dce3e9;
  --accent:#c9971c; --accent-ink:#7d5a07; --on-accent:#1b1405; --accent-soft:#f6ecd0;
  --good:#1d8456; --good-soft:#dcf1e6; --bad:#c2402b; --bad-soft:#fae1dc;
  --font-body:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,system-ui,sans-serif;
  --font-en:'Source Serif 4',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#18212a; --ink:#e8edf1; --muted:#97a5b1; --line:#2a3641;
  --accent:#e0b04a; --accent-ink:#e6bd62; --on-accent:#1b1405; --accent-soft:#2c2614;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ef7a67; --bad-soft:#321b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#18212a; --ink:#e8edf1; --muted:#97a5b1; --line:#2a3641;
  --accent:#e0b04a; --accent-ink:#e6bd62; --on-accent:#1b1405; --accent-soft:#2c2614;
  --good:#4cc38a; --good-soft:#15291f; --bad:#ef7a67; --bad-soft:#321b17; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#main{flex:1;min-height:0;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain}
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.02em}
h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:8px}
h2{font-size:13px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.08em}
.nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{background:none;border:0;padding:11px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:500;min-height:56px}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent-ink);font-weight:700}
.nav button[aria-current="page"] svg{stroke:var(--accent)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
input[type=text],input[type=number],input[type=search],select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px;font-size:16px}
input::placeholder{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;min-height:46px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.row>*{min-width:0}
.grow{flex:1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{background:none;border:0;padding:10px 6px;min-height:44px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}

/* word rows */
.words{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.w{display:grid;grid-template-columns:3.2rem 1fr auto;gap:10px;align-items:start;padding:12px 12px 12px 8px;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .no{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;color:var(--accent-ink);text-align:right;padding-top:1px}
.w .en{font-family:var(--font-en);font-weight:600;font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.w .ja{color:var(--muted);font-size:14px;margin-top:2px}
.w .acts{display:flex;gap:6px}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.note{color:var(--muted);font-size:13px}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.count{font-variant-numeric:tabular-nums}

/* list cards */
.lcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-height:56px}
.lcard .nm{font-weight:700;overflow-wrap:anywhere}
.lcard .ct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}

/* test */
.stats{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 0}
.card{position:relative;width:100%;max-height:100%;min-height:min(60vh,380px);background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 20px;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .2s ease;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.card .cno{position:absolute;top:14px;left:16px;font-size:13px;font-weight:700;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.card .cen{font-family:var(--font-en);font-weight:600;font-size:clamp(34px,11vw,52px);line-height:1.15;overflow-wrap:anywhere}
.card .cja{font-size:20px;font-weight:500;line-height:1.6;min-height:3.2em;display:flex;align-items:center;justify-content:center}
.card .tap{color:var(--muted);font-size:13px}
.card .ov{position:absolute;inset:0;border-radius:18px;display:flex;align-items:flex-start;padding:14px 22px;font-weight:700;font-size:44px;line-height:1;opacity:0;pointer-events:none}
.card .ov.r{background:var(--good-soft);color:var(--good);justify-content:flex-start}
.card .ov.l{background:var(--bad-soft);color:var(--bad);justify-content:flex-end}
.ans{display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.ans .btn{min-height:54px;font-size:15px}
.ans .no,.ans .yes{font-size:24px;line-height:1}
.ans .no{color:var(--bad);border-color:var(--bad)}
.ans .yes{color:var(--good);border-color:var(--good)}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--font-en)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sum .good{color:var(--good)}.sum .bad{color:var(--bad)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:80%;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;max-width:90%}
@media (prefers-reduced-motion:reduce){.card,.prog i{transition:none}}
</style>

</div>

/* ---------- storage ---------- */
let store = { lists: [{ id: 'weak', name: 'わからない単語', words: [] }],
  last: { source: 'range', from: 1, to: 100, count: 20, order: 'random', listId: 'weak', removeKnown: false } };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const s = JSON.parse(raw);
    if (s && Array.isArray(s.lists)) { store.lists = s.lists; store.last = Object.assign(store.last, s.last || {}); } }
} catch (e) {}
if (!store.lists.some(l => l.id === 'weak')) store.lists.unshift({ id: 'weak', name: 'わからない単語', words: [] });
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
const getList = id => store.lists.find(l => l.id === id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let tab = 'search';
let toastTimer;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(e => e.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 1800);
}
function confirmBtn(btn, label, action) {   // 2回押して実行
  const orig = btn.textContent; let armed = false, tm;
  btn.addEventListener('click', () => {
    if (!armed) { armed = true; btn.textContent = label; tm = setTimeout(() => { armed = false; btn.textContent = orig; }, 3000); }
    else { clearTimeout(tm); action(); }
  });
}
function addToList(listId, n) { const l = getList(listId); if (!l.words.includes(n)) { l.words.push(n); l.words.sort((a, b) => a - b); save(); } }
function removeFromList(listId, n) { const l = getList(listId); l.words = l.words.filter(x => x !== n); save(); }
const inAny = n => store.lists.some(l => l.words.includes(n));

function wordRow(n, opts = {}) {
  const [en, ja] = W[n - 1];
  return `<div class="w"><div class="no">${n}</div><div><div class="en">${esc(en)}</div><div class="ja">${esc(ja)}</div></div>
  <div class="acts">${opts.remove
    ? `<button class="icon-btn" data-rm="${n}" aria-label="リストから外す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`
    : `<button class="icon-btn" data-add="${n}" aria-label="リストに追加" aria-pressed="${inAny(n)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>`}

}

function openAddSheet(n, after) {
  const layer = $('#layer');
  const draw = () => {
    layer.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="リストに追加">
      <div class="row"><div class="grow"><div class="lbl">リストに追加</div><div style="font-family:var(--font-en);font-weight:600;font-size:20px">${n}　${esc(W[n - 1][0])}</div></div>
      <button class="btn small" id="sheetClose">閉じる</button></div>
      <div class="chips">${store.lists.map(l => `<button class="chip" data-l="${l.id}" aria-pressed="${l.words.includes(n)}">${esc(l.name)}</button>`).join('')}</div>
      <div class="note">押すと追加・解除できます。</div></div></div>`;
    layer.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      const l = getList(b.dataset.l);
      if (l.words.includes(n)) removeFromList(l.id, n); else addToList(l.id, n);
      draw(); if (after) after();
    });
    $('#sheetClose').onclick = close;
    $('#scrim').onclick = e => { if (e.target.id === 'scrim') close(); };
  };
  const close = () => { layer.innerHTML = ''; };
  draw();
}

/* ---------- search ---------- */
let sq = '', shown = 50;
function searchResults(q) {
  q = q.trim().toLowerCase();
  if (!q) return { list: Array.from({ length: N }, (_, i) => i + 1), total: N };
  const out = [], seen = new Set();
  const push = n => { if (!seen.has(n)) { seen.add(n); out.push(n); } };
  if (/^\d+$/.test(q) && +q >= 1 && +q <= N) push(+q);
  const tier = [[], [], [], []];
  W.forEach(([en, ja], i) => {
    const e = en.toLowerCase();
    if (e === q) tier[0].push(i + 1);
    else if (e.startsWith(q)) tier[1].push(i + 1);
    else if (e.includes(q)) tier[2].push(i + 1);
    else if (ja.toLowerCase().includes(q)) tier[3].push(i + 1);
  });
  tier.forEach(t => t.forEach(push));
  return { list: out, total: out.length };
}
function renderSearch() {
  main.innerHTML = `<div class="bar"><h1>金のフレーズ<small>単語帳</small></h1></div>
    <div class="field"><label for="q">英単語・日本語・見出し番号で検索</label>
    <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例: refer / 契約 / 250" value="${esc(sq)}"></div>
    <div id="res" style="display:flex;flex-direction:column;gap:10px"></div>`;
  const q = $('#q');
  q.oninput = () => { sq = q.value; shown = 50; drawRes(); };
  drawRes();
}
function drawRes() {
  const { list, total } = searchResults(sq);
  const box = $('#res');
  if (!total) { box.innerHTML = `<div class="empty">「${esc(sq)}」は見つかりませんでした。<br>綴りを短くして試してください。</div>`; return; }
  const slice = list.slice(0, shown);
  box.innerHTML = `<div class="note count">${sq.trim() ? total + ' 件' : '全 ' + N + ' 語（番号順）'}</div>
    <div class="words">${slice.map(n => wordRow(n)).join('')}</div>
    ${list.length > shown ? `<button class="btn" id="more">さらに表示（残り ${list.length - shown}）</button>` : ''}`;
  box.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openAddSheet(+b.dataset.add, () => { b.setAttribute('aria-pressed', inAny(+b.dataset.add)); }));
  const m = $('#more'); if (m) m.onclick = () => { shown += 50; drawRes(); };
}

let run = null;
function poolFromSettings(s) {
  if (s.source === 'list') { const l = getList(s.listId); return l ? l.words.slice() : []; }
  const a = Math.max(1, Math.min(N, s.from)), b = Math.max(1, Math.min(N, s.to));
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return Array.from({ length: hi - lo + 1 }, (_, i) => lo + i);
}

  const upd = () => {
    const p = poolFromSettings(s).length;
    $('#info').textContent = p ? `対象 ${p} 語 ／ 出題 ${Math.min(s.count, p)} 問` : '出題できる単語がありません。';
    $('#go').disabled = !p;
  };
  $('#src').onclick = e => { const b = e.target.closest('button'); if (!b) return; s.source = b.dataset.v; save(); renderTestSetup(); };
  $('#ord').onclick = e => { const b = e.target.closest('button'); if (!b) return; s.order = b.dataset.v; save(); renderTestSetup(); };
  ['from', 'to', 'cnt', 'lsel', 'rmk'].forEach(id => $('#' + id).addEventListener('input', read));
  $('#cc').onclick = e => { const b = e.target.closest('button'); if (!b) return; const p = poolFromSettings(s).length;
    $('#cnt').value = b.dataset.c === 'all' ? Math.max(1, p) : b.dataset.c; read(); };
  $('#go').onclick = () => { read(); startRun(poolFromSettings(s), s); };
  upd();
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startRun(pool, s, retry) {
  let q = pool.slice();
  if (!retry && s.order === 'random') shuffle(q);
  if (retry) shuffle(q);
  if (!retry) {
    q = q.slice(0, Math.min(s.count, q.length));
    if (s.order === 'seq') q.sort((a, b) => a - b);
  }
  run = { q, i: 0, known: [], unknown: [], hist: [], revealed: false, busy: false, fromList: s.source === 'list' ? s.listId : null, removeKnown: s.source === 'list' && s.removeKnown };
  tab = 'test'; renderRun();
}
function renderRun() {
  if (run.i >= run.q.length) return renderResult();
  const n = run.q[run.i], [en, ja] = W[n - 1];
  main.innerHTML = `<div class="stats"><button class="btn small" id="quit">やめる</button><div class="prog"><i style="width:${run.i / run.q.length * 100}%"></i></div><span>${run.i + 1} / ${run.q.length}</span></div>
  <div class="stage"><div class="card" id="card" role="button" tabindex="0" aria-label="タップで日本語訳を表示">
    <div class="ov r">◯</div><div class="ov l">✕</div>
    <div class="cno">No.${n}</div><div class="cen">${esc(en)}</div>
    <div class="cja" id="cja"><span class="tap">タップで日本語訳</span></div></div></div>
  <div class="ans"><button class="btn no" id="bNo" aria-label="わからない">✕</button><button class="btn small" id="bUndo" ${run.hist.length ? '' : 'disabled'} aria-label="1つ戻す">戻す</button><button class="btn yes" id="bYes" aria-label="わかった">◯</button></div>`;
  run.revealed = false;
  const card = $('#card'), ovR = card.querySelector('.ov.r'), ovL = card.querySelector('.ov.l');
  const flip = () => { run.revealed = !run.revealed;
    $('#cja').innerHTML = run.revealed ? esc(ja) : '<span class="tap">タップで日本語訳</span>'; };
  let sx = 0, dx = 0, moved = false, down = false;
  card.onpointerdown = e => { down = true; moved = false; sx = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; };
  card.onpointermove = e => { if (!down) return; dx = e.clientX - sx; if (Math.abs(dx) > 8) moved = true;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
    const k = Math.min(1, Math.abs(dx) / 110); ovR.style.opacity = dx > 0 ? k : 0; ovL.style.opacity = dx < 0 ? k : 0; };
  const end = () => { if (!down) return; down = false; card.style.transition = '';
    if (moved && Math.abs(dx) > 90) answer(dx > 0);
    else { card.style.transform = ''; ovR.style.opacity = ovL.style.opacity = 0; if (!moved) flip(); } };
  card.onpointerup = end;
  card.onpointercancel = () => { down = false; card.style.transition = ''; card.style.transform = ''; ovR.style.opacity = ovL.style.opacity = 0; };
  card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
  $('#bNo').onclick = () => answer(false);
  $('#bYes').onclick = () => answer(true);
  $('#bUndo').onclick = undo;
  $('#quit').onclick = () => { if (run.known.length + run.unknown.length) renderResult(true); else { run = null; renderTestSetup(); } };
  card.focus({ preventScroll: true });
}
function answer(known) {
  if (!run || run.busy) return; run.busy = true;
  const card = $('#card'); const n = run.q[run.i];
  card.style.transition = 'transform .2s ease'; card.style.transform = `translateX(${known ? 520 : -520}px) rotate(${known ? 18 : -18}deg)`;
  setTimeout(() => {
    run.hist.push({ n, known, removed: false, added: false });
    const h = run.hist[run.hist.length - 1];
    if (known) { run.known.push(n);
      if (run.removeKnown && run.fromList && getList(run.fromList).words.includes(n)) { removeFromList(run.fromList, n); h.removed = true; } }
    else { run.unknown.push(n); const w = getList('weak'); if (!w.words.includes(n)) { addToList('weak', n); h.added = true; } }
    run.i++; run.busy = false; renderRun();
  }, 190);
}
function undo() {
  if (!run || !run.hist.length || run.busy) return;
  const h = run.hist.pop();
  if (h.known) { run.known.pop(); if (h.removed) addToList(run.fromList, h.n); }
  else { run.unknown.pop(); if (h.added) removeFromList('weak', h.n); }
  run.i--; renderRun();
}
function renderResult(early) {
  const done = run.known.length + run.unknown.length, un = run.unknown.slice().sort((a, b) => a - b);
  main.innerHTML = `<div class="bar"><h1>${early ? '結果（途中）' : '結果'}</h1></div>
  <div class="sum"><div><div class="lbl">わかった</div><div class="big good">${run.known.length}</div></div><div><div class="lbl">わからない</div><div class="big bad">${un.length}</div></div></div>
  <div class="note count">${done} 問中 ${done ? Math.round(run.known.length / done * 100) : 0}% 正解。わからなかった単語は「わからない単語」リストに保存済みです。</div>
  ${un.length ? `<h2>わからなかった単語</h2><div class="words">${un.map(n => wordRow(n)).join('')}</div>` : '<div class="empty">全部わかりました。</div>'}
  <div class="col" style="display:flex;flex-direction:column;gap:10px">
  ${un.length ? '<button class="btn primary" id="again">わからなかった単語だけもう一度</button>' : ''}
  <button class="btn" id="same">同じ設定でもう一度</button><button class="btn" id="back">設定にもどる</button></div>`;
  main.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openAddSheet(+b.dataset.add, () => b.setAttribute('aria-pressed', inAny(+b.dataset.add))));
  const a = $('#again'); if (a) a.onclick = () => startRun(un, store.last, true);
  $('#same').onclick = () => startRun(poolFromSettings(store.last), store.last);
  $('#back').onclick = () => { run = null; renderTestSetup(); };
}

/* ---------- lists ---------- */
let openList = null;
function parseNums(t) {
  const out = new Set();
  t.split(/[\s,、，]+/).filter(Boolean).forEach(p => {
    const m = p.match(/^(\d+)[-〜~ー](\d+)$/);
    if (m) { let a = +m[1], b = +m[2]; if (a > b) [a, b] = [b, a]; for (let i = a; i <= b && i - a < 1000; i++) if (i >= 1 && i <= N) out.add(i); }
    else if (/^\d+$/.test(p) && +p >= 1 && +p <= N) out.add(+p);
  });
  return [...out];
}
function renderLists() {
  if (openList && !getList(openList)) openList = null;
  if (!openList) {
    main.innerHTML = `<div class="bar"><h1>リスト</h1></div>
    <div class="col" style="display:flex;flex-direction:column;gap:10px">${store.lists.map(l => `<button class="lcard" data-id="${l.id}"><span class="nm">${esc(l.name)}</span><span class="ct">${l.words.length} 語</span></button>`).join('')}</div>
    <div class="field"><label for="newName">新しいリストを作る</label><div class="row"><input id="newName" type="text" maxlength="30" placeholder="リスト名（例: 長文で間違えた単語）"><button class="btn primary" id="mk">作成</button></div></div>`;
    main.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { openList = b.dataset.id; renderLists(); });
    const mk = () => { const v = $('#newName').value.trim(); if (!v) return toast('リスト名を入力してください');
      const id = 'l' + Date.now().toString(36); store.lists.push({ id, name: v, words: [] }); save(); openList = id; renderLists(); };
    $('#mk').onclick = mk; $('#newName').onkeydown = e => { if (e.key === 'Enter') mk(); };
    return;
  }
  const l = getList(openList);
  main.innerHTML = `<div class="row"><button class="btn small" id="back">‹ 戻る</button><h1 class="grow" style="overflow-wrap:anywhere">${esc(l.name)}</h1><span class="note count">${l.words.length} 語</span></div>
  <button class="btn primary" id="test" ${l.words.length ? '' : 'disabled'}>このリストでテスト</button>
  ${l.words.length ? `<div class="words">${l.words.map(n => wordRow(n, { remove: true })).join('')}</div>` : '<div class="empty">まだ単語がありません。検索画面のしおりボタンか、下の欄から番号で追加できます。</div>'}
  <div class="field"><label for="nums">見出し番号で追加（例: 12 15 30-35）</label><div class="row"><input id="nums" type="text" inputmode="numeric" placeholder="番号をスペースかカンマで区切る"><button class="btn" id="addn">追加</button></div></div>
  <div class="field"><label for="rn">リスト名を変更</label><div class="row"><input id="rn" type="text" maxlength="30" value="${esc(l.name)}"><button class="btn" id="rnb">変更</button></div></div>
  <div class="row"><button class="btn danger grow" id="clr" ${l.words.length ? '' : 'disabled'}>単語を全部外す</button>${l.id === 'weak' ? '' : '<button class="btn danger grow" id="del">リストを削除</button>'}</div>`;
  $('#back').onclick = () => { openList = null; renderLists(); };
  $('#test').onclick = () => { Object.assign(store.last, { source: 'list', listId: l.id, count: Math.min(Math.max(store.last.count, 1), l.words.length) }); if (store.last.count < 1) store.last.count = 20; save(); tab = 'test'; run = null; draw(); };
  main.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { removeFromList(l.id, +b.dataset.rm); renderLists(); });
  const addn = () => { const ns = parseNums($('#nums').value); if (!ns.length) return toast('1〜' + N + ' の番号を入力してください');
    ns.forEach(n => addToList(l.id, n)); renderLists(); toast(ns.length + ' 語を追加しました'); };
  $('#addn').onclick = addn; $('#nums').onkeydown = e => { if (e.key === 'Enter') addn(); };
  const rn = () => { const v = $('#rn').value.trim(); if (!v) return; l.name = v; save(); renderLists(); toast('名前を変更しました'); };
  $('#rnb').onclick = rn;

  const d = $('#del'); if (d) confirmBtn(d, 'もう一度押すと削除します', () => { store.lists = store.lists.filter(x => x.id !== l.id); save(); openList = null; renderLists(); });
}

  document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));

document.querySelectorAll('.nav button').forEach(b => b.onclick = () => { tab = b.dataset.tab; if (tab === 'lists') openList = null; draw(); });
draw();
